name: "Two-Way Audio"
version: "1.0.0"
slug: "twowayaudio"
description: "Generic talkback via go2rtc WebRTC (Tapo, Frigate, any go2rtc stream)"
arch:
  - aarch64
  - amd64

startup: application
boot: auto
init: false

ports:
  "8081/tcp": 8081
ports_description:
  "8081/tcp": "Two-Way Audio REST API"

ingress: true
ingress_port: 8081
ingress_entry: /
panel_icon: mdi:microphone
panel_title: "Two-Way Audio"

options:
  go2rtc_api: "http://192.168.1.131:1984"
  volume: 1.0
  tts_language: "fr"

schema:
  go2rtc_api: str
  volume: "float(0.0,2.0)"
  tts_language: "str?"

watchdog: "http://[HOST]:[PORT:8081]/health"
